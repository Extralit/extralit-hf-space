name: Build & Deploy HF Space

on:
  repository_dispatch:
    types:
      - build-hf-space
  workflow_dispatch:

# Keep `id-token: write` job-scoped to deploy-space, else any job can mint a prod token.
permissions:
  contents: read

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.resolve.outputs.env_name }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      tag_latest: ${{ steps.resolve.outputs.tag_latest }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      pr_space_slug: ${{ steps.resolve.outputs.pr_space_slug }}
    steps:
      - name: Resolve build parameters
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PAYLOAD_TAG: ${{ github.event.client_payload.tag }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch }}
          PAYLOAD_IS_RELEASE: ${{ github.event.client_payload.is_release }}
        run: |
          set -euo pipefail

          # No client_payload means staging only; re-run the original dispatch to redeploy prod.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BRANCH="$REF_NAME"
            IMAGE_TAG="latest"
          elif [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            IMAGE_TAG="$PAYLOAD_TAG"
            BRANCH="${PAYLOAD_BRANCH:-main}"
          else
            echo "::error::Unsupported event: $EVENT_NAME"
            exit 1
          fi

          # `is_release` is the ONLY production signal — branch names are not load-bearing.
          if [[ "${PAYLOAD_IS_RELEASE:-}" == "true" ]]; then
            ENV_NAME="production"
            TAG_LATEST="true"
            PLATFORMS="linux/amd64,linux/arm64"
            PR_SPACE_SLUG=""
          elif [[ "$BRANCH" == "main" ]]; then
            # Trunk. The `develop` migration alias is gone; a stray payload gets a preview Space.
            ENV_NAME="staging"
            TAG_LATEST="true"
            PLATFORMS="linux/amd64"
            PR_SPACE_SLUG=""
          else
            # PR merge refs and anything else get a preview Space, and never move `:latest`.
            ENV_NAME="staging"
            TAG_LATEST="false"
            PLATFORMS="linux/amd64"
            if [[ "$BRANCH" =~ ^([0-9]+)/merge$ ]]; then
              PR_SPACE_SLUG="pr-${BASH_REMATCH[1]}"
            else
              # Expansion not `| head -c 50`, which under pipefail couples exit status to a pipe.
              slug=$(echo "$BRANCH" | sed 's|[^a-zA-Z0-9-]|-|g')
              PR_SPACE_SLUG="${slug:0:50}"
            fi
          fi

          echo "Resolved: env=$ENV_NAME branch=$BRANCH tag=$IMAGE_TAG tag_latest=$TAG_LATEST platforms=$PLATFORMS pr_space_slug=$PR_SPACE_SLUG"
          {
            echo "env_name=$ENV_NAME"
            echo "image_tag=$IMAGE_TAG"
            echo "tag_latest=$TAG_LATEST"
            echo "platforms=$PLATFORMS"
            echo "pr_space_slug=$PR_SPACE_SLUG"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}
    outputs:
      # Multi-platform builds yield the manifest-list digest, which is what `FROM` wants.
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Keep the token out of .git/config, which the docker build context would pick up.
          persist-credentials: false

      - name: Construct Docker tags
        env:
          DOCKER_REPO: ${{ vars.DOCKER_REPO }}
          IMAGE_TAG: ${{ needs.resolve-env.outputs.image_tag }}
          TAG_LATEST: ${{ needs.resolve-env.outputs.tag_latest }}
        run: |
          TAGS="${DOCKER_REPO}:${IMAGE_TAG}"
          if [[ "$TAG_LATEST" == "true" ]]; then
            TAGS="$TAGS,${DOCKER_REPO}:latest"
          fi
          echo "DOCKER_TAGS=$TAGS" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ needs.resolve-env.outputs.platforms }}
          build-args: |
            EXTRALIT_SERVER_IMAGE=${{ vars.EXTRALIT_SERVER_IMAGE }}
            EXTRALIT_VERSION=${{ needs.resolve-env.outputs.image_tag }}
          tags: ${{ env.DOCKER_TAGS }}
          push: true

  deploy-space:
    needs: [resolve-env, build]
    if: needs.resolve-env.outputs.pr_space_slug == ''
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}
    # Keyless: no HF_TOKEN. Job-scoped on purpose — see the note at the top of this file.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Pin HF Space to the image just built
        env:
          # Whole config for keyless auth; huggingface_hub exchanges it or raises OIDCError.
          HF_OIDC_RESOURCE: spaces/${{ vars.HF_SPACE_ID }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          DOCKER_REPO: ${{ vars.DOCKER_REPO }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          # Pinned: this step handles credentials, so its one dependency is not a moving target.
          pip install -q 'huggingface_hub==1.26.0'
          python - <<'PY'
          import os
          import re
          import time

          from huggingface_hub import HfApi, SpaceStage

          space = os.environ["HF_SPACE_ID"]
          pin = f"{os.environ['DOCKER_REPO']}@{os.environ['IMAGE_DIGEST']}"
          api = HfApi()

          # Commit-to-rebuild, not restart_space: the restart API rejects OIDC tokens with a 401.
          with open(api.hf_hub_download(space, "Dockerfile", repo_type="space")) as fh:
              before = fh.read()
          after, found = re.subn(r"^FROM\s+\S+", f"FROM {pin}", before, count=1, flags=re.M)
          if not found:
              raise SystemExit(f"No FROM line in the {space} Dockerfile")

          if after == before:
              # Already serving this digest, so a no-op commit would trigger no rebuild to wait for.
              print(f"{space} already pinned to {pin}")
              runtime = api.get_space_runtime(space)
          else:
              print(f"Pinning {space} to {pin}")
              api.upload_file(
                  path_or_fileobj=after.encode(),
                  path_in_repo="Dockerfile",
                  repo_id=space,
                  repo_type="space",
                  commit_message=f"Deploy {pin}",
              )
              # wait_for_space returns at the first non-build poll, which is the stale RUNNING.
              time.sleep(30)
              runtime = api.wait_for_space(space, timeout=2700, poll_interval=10)

          print(f"Stage: {runtime.stage}")
          # The rebuild is async, so without this a BUILD_ERROR still reports a green deploy.
          if runtime.stage != SpaceStage.RUNNING:
              raise SystemExit(f"Deploy failed: {space} settled in {runtime.stage}")
          PY

  deploy-pr-space:
    needs: [resolve-env, build]
    if: needs.resolve-env.outputs.pr_space_slug != ''
    runs-on: ubuntu-latest
    # `staging` env resolves the EXTRALIT_* config propagated onto the preview Space.
    environment: ${{ needs.resolve-env.outputs.env_name }}
    env:
      # A Space, NOT a git branch; its OAuth app is pinned to this name. Do not "fix" this.
      SOURCE_SPACE: extralit-dev/develop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Only scripts/deploy_pr_space.py runs from here, and it talks to HF, not git.
          persist-credentials: false

      - name: Deploy PR Space
        env:
          # Irreducible: Trusted Publishers cannot create repos, and duplicate_space does.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PR_SPACE_SLUG: ${{ needs.resolve-env.outputs.pr_space_slug }}
          IMAGE_TAG: ${{ needs.resolve-env.outputs.image_tag }}
          # Same source `build` pushed to; hardcoding allows deploying a never-built image.
          DOCKER_REPO: ${{ vars.DOCKER_REPO }}
          # List EXTRALIT_* secrets one at a time; `toJSON(secrets)` tripped GitHub's detector.
          ALL_SECRETS: "{}"
          # Variables are not credentials, so the whole set is safe to pass.
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          # Pinned: this step handles HF_TOKEN, so its one dependency is not a moving target.
          pip install -q 'huggingface_hub==1.26.0'
          python scripts/deploy_pr_space.py
